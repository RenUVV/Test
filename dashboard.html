<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          mono: ['JetBrains Mono', 'SF Mono', 'Monaco', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: #09090b;
    color: #fafafa;
  }

  ::selection {
    background-color: #3f3f46;
    color: #fafafa;
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #3f3f46;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #52525b;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn-tactile {
    transition: all 0.15s ease;
  }
  .btn-tactile:active {
    transform: scale(0.98);
  }

  .input-focus {
    transition: all 0.15s ease;
  }
  .input-focus:focus {
    outline: none;
    border-color: #52525b;
    box-shadow: 0 0 0 2px #09090b, 0 0 0 4px #27272a;
  }

  .copy-btn.copied {
    color: #34d399 !important;
    background-color: #064e3b !important;
  }

  @media print {
    .no-print { display: none !important; }
    body { background: white; color: black; }
    .table-wrap { box-shadow: none; border: 1px solid #000; }
    .stat-card { border: 1px solid #000; box-shadow: none; }
    th, td { border: 1px solid #000; color: black; }
  }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased min-h-screen flex flex-col">

<div class="topbar no-print sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800 h-14 px-6 flex items-center justify-between shadow-[0_1px_2px_rgba(0,0,0,0.3)]">
  <div class="topbar-brand flex items-center gap-3">
    <div class="dot w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></div>
    <h1 class="text-sm font-semibold tracking-tight text-zinc-100">Dashboard - Arsyila Bersaudara</h1>
  </div>
  <a href="index.html" class="text-xs font-medium text-zinc-400 hover:text-zinc-100 transition-colors flex items-center gap-1 btn-tactile">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back
  </a>
</div>

<div class="page flex-1 p-6 max-w-7xl mx-auto w-full" style="animation: fadein 0.4s ease-out forwards;">

  <div class="date-section bg-zinc-900 border border-zinc-800 rounded-xl p-4 mb-6 shadow-[0_1px_2px_rgba(0,0,0,0.3)] flex flex-wrap items-center justify-between gap-4">
    <div class="date-nav flex items-center gap-3">
      <button class="nav-btn w-8 h-8 flex items-center justify-center rounded-lg border border-zinc-800 bg-zinc-950 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100 btn-tactile" onclick="prevDate()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="flex flex-col">
        <div class="date-label text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Date</div>
        <div class="date-display text-sm font-semibold text-zinc-100" id="date-display">—</div>
      </div>
      <button class="nav-btn w-8 h-8 flex items-center justify-center rounded-lg border border-zinc-800 bg-zinc-950 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100 btn-tactile" onclick="nextDate()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <input type="date" id="date" onchange="onDateChange()" class="ml-2 px-3 py-1.5 text-sm bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-100 input-focus hover:border-zinc-700 cursor-pointer">
    </div>
    <div class="date-actions flex items-center gap-2 no-print">
      <button class="btn-reset px-4 py-1.5 rounded-lg border border-red-900/50 bg-red-950/30 text-red-400 text-xs font-semibold hover:bg-red-950/50 btn-tactile" onclick="resetDate()">Reset</button>
      <button class="btn-doneall px-4 py-1.5 rounded-lg border border-emerald-900/50 bg-emerald-950/30 text-emerald-400 text-xs font-semibold hover:bg-emerald-950/50 btn-tactile" onclick="doneAll()">Done</button>
    </div>
  </div>

  <div class="stats-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="stat-card total bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-[0_1px_2px_rgba(0,0,0,0.3)] border-t-4 border-t-zinc-100">
      <div class="stat-label text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Total Bill</div>
      <div class="stat-count text-2xl font-bold text-zinc-100 mt-1 font-mono tabular-nums" id="st-total">0</div>
      <div class="stat-amount text-xs text-zinc-400 mt-1 font-mono tabular-nums" id="st-total-amt">RM 0.00</div>
    </div>
    <div class="stat-card tunai bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-[0_1px_2px_rgba(0,0,0,0.3)] border-t-4 border-t-emerald-600">
      <div class="stat-label text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Cash</div>
      <div class="stat-count text-2xl font-bold text-zinc-100 mt-1 font-mono tabular-nums" id="st-tunai">0</div>
      <div class="stat-amount text-xs text-zinc-400 mt-1 font-mono tabular-nums" id="sum-tunai">RM 0.00</div>
    </div>
    <div class="stat-card cod bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-[0_1px_2px_rgba(0,0,0,0.3)] border-t-4 border-t-amber-600">
      <div class="stat-label text-[11px] font-semibold uppercase tracking-wider text-zinc-500">COD</div>
      <div class="stat-count text-2xl font-bold text-zinc-100 mt-1 font-mono tabular-nums" id="st-cod">0</div>
      <div class="stat-amount text-xs text-zinc-400 mt-1 font-mono tabular-nums" id="sum-cod">RM 0.00</div>
    </div>
    <div class="stat-card acc bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-[0_1px_2px_rgba(0,0,0,0.3)] border-t-4 border-t-sky-600">
      <div class="stat-label text-[11px] font-semibold uppercase tracking-wider text-zinc-500">ACC</div>
      <div class="stat-count text-2xl font-bold text-zinc-100 mt-1 font-mono tabular-nums" id="st-acc">0</div>
      <div class="stat-amount text-xs text-zinc-400 mt-1 font-mono tabular-nums" id="sum-acc">RM 0.00</div>
    </div>
  </div>

  <div class="filters-row flex flex-wrap items-center gap-3 mb-4 no-print">
    <div class="search-wrap relative flex-1 min-w-[200px]">
      <svg class="search-icon absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="f-search" placeholder="Search sender, receiver, details..." oninput="renderTable()" class="w-full pl-9 pr-3 py-2 text-sm bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-100 placeholder-zinc-500 input-focus hover:border-zinc-700">
    </div>
    <select class="filter-select px-3 py-2 text-sm bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-100 input-focus hover:border-zinc-700 cursor-pointer" id="f-pay" onchange="renderTable()">
      <option value="">All Types</option>
      <option value="TUNAI">CASH</option>
      <option value="COD">COD</option>
      <option value="ACC">ACC</option>
    </select>
  </div>

  <div class="table-wrap bg-zinc-900 border border-zinc-800 rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.3)] overflow-hidden">
    <div class="table-header px-5 py-3 border-b border-zinc-800 flex items-center justify-between bg-zinc-950/50">
      <div class="table-title text-sm font-semibold text-zinc-100">Senarai Bil</div>
      <div class="table-count text-xs font-medium text-zinc-500 font-mono tabular-nums" id="table-count">0 rekod</div>
    </div>
    <div style="overflow-x:auto;">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-zinc-950 border-b border-zinc-800">
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">NO</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">DATE</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">STAFF</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">SENDER</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">Tel</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">FROM</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">RECEIVER</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">Tel</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">TO</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">DETAILS</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">PAYMENT</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center">RM</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center no-print">Action</th>
            <th class="px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 text-center no-print">Copy</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-zinc-800">
          <tr><td colspan="14" class="loading py-12 text-center text-sm text-zinc-500">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:999;align-items:center;justify-content:center;" class="no-print">
  <div class="bg-zinc-900 rounded-xl border border-zinc-800 shadow-2xl p-6 max-w-sm w-full" style="animation: fadein 0.2s ease-out forwards;">
    <div class="text-base font-semibold text-zinc-100 mb-2">Confirm Action</div>
    <div class="text-sm text-zinc-400 mb-6 leading-relaxed" id="modal-msg"></div>
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-zinc-800 bg-zinc-950 text-zinc-300 text-sm font-medium hover:bg-zinc-800 btn-tactile">Cancel</button>
      <button onclick="confirmDelete()" class="px-4 py-2 rounded-lg border border-transparent bg-red-600 text-white text-sm font-medium hover:bg-red-700 btn-tactile">Yes, Delete</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxuXSVvOR9jV7_Fdla0WK_3vtRc20TIrhFKBVvEvelWAlvdWk8MvjZlsGRBOyhdSvPU_w/exec";

let data=[];
let itemToDelete = null;
const dateInput=document.getElementById('date');
const dateDisplay=document.getElementById('date-display');

function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function formatDisplay(val){
  if(!val)return'—';
  const[y,m,d]=val.split('-');
  const months=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogs','Sep','Okt','Nov','Dis'];
  return d+' '+months[parseInt(m)-1]+' '+y;
}

function setDate(val){
  dateInput.value=val;
  dateDisplay.textContent=formatDisplay(val);
}

setDate(today());

function onDateChange(){dateDisplay.textContent=formatDisplay(dateInput.value);load();}
function prevDate(){let d=new Date(dateInput.value);d.setDate(d.getDate()-1);setDate(d.toISOString().split('T')[0]);load();}
function nextDate(){let d=new Date(dateInput.value);d.setDate(d.getDate()+1);setDate(d.toISOString().split('T')[0]);load();}

function load(){
  const d=dateInput.value;
  fetch(SCRIPT_URL+"?action=getAll&date="+d)
  .then(r=>r.json())
  .then(json=>{
    data=json.data||[];
    renderTable();
    calc();
  })
  .catch(()=>{
    document.getElementById('tbody').innerHTML='<tr><td colspan="14" class="empty py-12 text-center text-sm text-zinc-500">Gagal memuatkan data.</td></tr>';
  });
}

function copyNum(btn, num) {
  var str = String(num);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(str).then(function() {
      btn.classList.add('copied');
      setTimeout(function(){ btn.classList.remove('copied'); }, 1500);
    }).catch(function() {
      fallbackCopy(btn, str);
    });
  } else {
    fallbackCopy(btn, str);
  }
}

function fallbackCopy(btn, str) {
  var ta = document.createElement('textarea');
  ta.value = str;
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    btn.classList.add('copied');
    setTimeout(function(){ btn.classList.remove('copied'); }, 1500);
  } catch(e) {
    alert('Copy failed. Number: ' + str);
  }
  document.body.removeChild(ta);
}

function renderTable(){
  const tb=document.getElementById('tbody');
  const s=document.getElementById('f-search').value.toLowerCase();
  const pay=document.getElementById('f-pay').value;

  let filtered=data.filter(r=>{
    if(!r || r.join('').trim()==='')return false;
    return(!s||r.join(' ').toLowerCase().includes(s))&&(!pay||r[10]===pay);
  });

  document.getElementById('table-count').textContent=filtered.length+' rekod';

  if(!filtered.length){
    tb.innerHTML='<tr><td colspan="14" class="empty py-12 text-center text-sm text-zinc-500">No Data Found.</td></tr>';
    return;
  }

  tb.innerHTML=filtered.map(r=>`
  <tr class="hover:bg-zinc-800/50 transition-colors duration-150 group">
    <td class="px-4 py-3 text-center text-sm font-mono font-medium text-zinc-100">${r[0]}</td>
    <td class="px-4 py-3 text-center text-sm text-zinc-400 font-mono tabular-nums">${r[1]}</td>
    <td class="px-4 py-3 text-center text-sm text-zinc-100 font-medium">${r[2]}</td>
    <td class="px-4 py-3 text-center text-sm text-zinc-300">${r[3]}</td>
    <td class="px-4 py-3 text-center text-sm font-mono text-zinc-400">${r[4]}</td>
    <td class="px-4 py-3 text-center text-sm text-zinc-300">${r[5]}</td>
    <td class="px-4 py-3 text-center text-sm text-zinc-100 font-medium">${r[6]}</td>
    <td class="px-4 py-3 text-center text-sm font-mono text-zinc-400">${r[7]}</td>
    <td class="px-4 py-3 text-center text-sm text-zinc-300">${r[8]}</td>
    <td class="px-4 py-3 text-center text-sm text-zinc-400 max-w-[200px] truncate" title="${r[9]}">${r[9]}</td>
    <td class="px-4 py-3 text-center">
      <span class="pay-badge inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold border ${r[10]==='TUNAI' ? 'bg-emerald-950/40 text-emerald-400 border-emerald-800/50' : r[10]==='COD' ? 'bg-amber-950/40 text-amber-400 border-amber-800/50' : 'bg-sky-950/40 text-sky-400 border-sky-800/50'}">
        ${r[10]}
      </span>
    </td>
    <td class="px-4 py-3 text-center text-sm font-mono font-semibold text-zinc-100 tabular-nums">RM ${parseFloat(r[11]||0).toFixed(2)}</td>
    <td class="px-4 py-3 text-center no-print">
      <button class="delete-btn p-1.5 rounded-md text-zinc-500 hover:text-red-400 hover:bg-red-950/30 transition-all duration-150 btn-tactile" onclick="showDeleteModal('${r[0]}', '${r[1]}')" title="Delete">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
    </td>
    <td class="px-4 py-3 text-center no-print">
      <button class="copy-btn p-1.5 rounded-md text-zinc-500 hover:text-zinc-100 hover:bg-zinc-800 transition-all duration-150 btn-tactile" onclick="copyNum(this, '${r[7]}')" title="Copy receiver number">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </td>
  </tr>`).join('');
}

function calc(){
  let t=0,c=0,a=0,ct=0,cc=0,ca=0;
  data.forEach(r=>{
    if(!r || r.join('').trim()==='')return;
    let amt=parseFloat(r[11])||0;
    if(r[10]==='TUNAI'){t+=amt;ct++;}
    if(r[10]==='COD'){c+=amt;cc++;}
    if(r[10]==='ACC'){a+=amt;ca++;}
  });
  const total=ct+cc+ca;
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-total-amt').textContent='RM '+(t+c+a).toFixed(2);
  document.getElementById('st-tunai').textContent=ct;
  document.getElementById('sum-tunai').textContent='RM '+t.toFixed(2);
  document.getElementById('st-cod').textContent=cc;
  document.getElementById('sum-cod').textContent='RM '+c.toFixed(2);
  document.getElementById('st-acc').textContent=ca;
  document.getElementById('sum-acc').textContent='RM '+a.toFixed(2);
}

function doneAll(){
  let t=0,c=0,a=0;
  data.forEach(r=>{
    if(!r || r.join('').trim()==='')return;
    let amt=parseFloat(r[11])||0;
    if(r[10]==='TUNAI')t+=amt;
    if(r[10]==='COD')c+=amt;
    if(r[10]==='ACC')a+=amt;
  });

fetch(SCRIPT_URL,{
  method:'POST',
  mode:'no-cors',
  body:JSON.stringify({
    action:'doneAll',
    date: dateInput.value,
    tunai:t,
    cod:c,
    acc:a,
    total:(t+c+a)
  })
});

  alert('Done');
}

function resetDate(){
  document.getElementById('modal-msg').textContent=
    'All data for '+dateDisplay.textContent+' will be deleted.';
  document.getElementById('modal-overlay').style.display='flex';
}

function showDeleteModal(no, tarikh) {
    itemToDelete = { no, tarikh };
    document.getElementById('modal-msg').textContent =
        'Are you sure you want to delete bill No. ' + no + '?';
    document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal(){
  document.getElementById('modal-overlay').style.display='none';
  itemToDelete = null;
}

function confirmDelete(){
    if (!itemToDelete) {
        closeModal();
        return;
    }
    const { no, tarikh } = itemToDelete;
    closeModal();

    fetch(SCRIPT_URL + '?action=deleteBill&no=' + encodeURIComponent(no) + '&tarikh=' + encodeURIComponent(tarikh))
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            load();
        } else {
            alert('Gagal memadam: ' + (result.message || 'Tiada respons'));
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Ralat semasa menghubungi server.');
    });
}

function confirmReset(){
  closeModal();
  const d=dateInput.value;
  fetch(SCRIPT_URL+'?action=resetByDate&date='+d)
  .then(r=>r.json())
  .then(()=>load())
  .catch(()=>load());
}

load();
</script>

</body>
</html>
